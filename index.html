<script>
var A="<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Hokimiyatlar bo‘linishi — Muvozanat o‘yini<\/title>\n<style>\n:root{--bg:#f4f1ea;--card:#ffffff;--ink:#16203a;--mute:#5d6682;--line:#e1dccf;--gold:#b8860b;\n--q:#2f6fed;--i:#d9822b;--s:#1f9d6b;--ok:#1f9d6b;--bad:#d64545;--shadow:0 10px 30px rgba(22,32,58,.10);\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1226;--card:#161d38;--ink:#eef0f8;--mute:#9aa3c2;--line:#27305a;--gold:#e8b94a;--q:#5b92ff;--i:#f0a04b;--s:#3dd6a0;--shadow:0 10px 30px rgba(0,0,0,.4)}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,\"Times New Roman\",serif;min-height:100vh;\nbackground-image:radial-gradient(circle at 15% 0%,rgba(47,111,237,.12),transparent 40%),radial-gradient(circle at 90% 10%,rgba(217,130,43,.12),transparent 40%),radial-gradient(circle at 50% 100%,rgba(31,157,107,.12),transparent 45%)}\n.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}\nh1{font-size:clamp(24px,5vw,36px);margin:6px 0 4px;letter-spacing:.2px}\n.sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:14px;margin:0 0 18px}\n.tag{display:inline-block;font:600 12px system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}\n.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}\n.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}\n.p.on{transform:translateY(-6px) scale(1.03)}\n.p .ic{font-size:26px}\n.p b{display:block;font:700 12px system-ui,sans-serif;margin:4px 0 8px}\n.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}\n.bar i{display:block;height:100%;width:0;border-radius:8px;transition:width .6s}\n.p[data-b=q] .bar i{background:var(--q)}.p[data-b=i] .bar i{background:var(--i)}.p[data-b=s] .bar i{background:var(--s)}\n.p[data-b=q].on{box-shadow:0 0 0 2px var(--q),var(--shadow)}.p[data-b=i].on{box-shadow:0 0 0 2px var(--i),var(--shadow)}.p[data-b=s].on{box-shadow:0 0 0 2px var(--s),var(--shadow)}\n.prog{display:flex;gap:5px;margin-bottom:14px}\n.prog span{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .3s}\n.prog span.done{background:var(--ok)}.prog span.wrong{background:var(--bad)}.prog span.cur{background:var(--gold)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);animation:in .4s}\n@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n.meta{display:flex;justify-content:space-between;font:600 13px system-ui,sans-serif;color:var(--mute);margin-bottom:10px}\n.kind{font:700 11px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--gold)}\n.q{font-size:clamp(18px,3.6vw,22px);line-height:1.45;margin:6px 0 16px}\n.opts{display:grid;gap:10px}\n.o{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,sans-serif;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}\n.o:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold)}\n.o .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px system-ui,sans-serif;background:var(--card);border:1px solid var(--line)}\n.o.ok{border-color:var(--ok);background:rgba(31,157,107,.14)}.o.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}\n.o.bad{border-color:var(--bad);background:rgba(214,69,69,.12);animation:shake .35s}.o.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}\n.o:disabled{cursor:default}\n@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.fb{display:none;margin-top:16px;padding:14px;border-radius:14px;font:15px/1.5 system-ui,sans-serif;background:var(--bg);border-left:4px solid var(--gold)}\n.fb.show{display:block;animation:in .3s}\n.fb b{display:block;margin-bottom:4px}\n.btn{margin-top:16px;padding:13px 22px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:700 15px system-ui,sans-serif;cursor:pointer;display:none}\n.btn.show{display:inline-block}.btn:hover{opacity:.88}\n.res{text-align:center}\n.score{font-size:64px;font-weight:700;color:var(--gold);margin:6px 0}\n.rank{font-size:22px;margin:0 0 8px}\n.res p{font-family:system-ui,sans-serif;color:var(--mute);line-height:1.5}\n.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}\n.sum div{background:var(--bg);border-radius:14px;padding:12px;font:600 13px system-ui,sans-serif}\n.sum em{display:block;font:700 22px Georgia,serif;font-style:normal;margin-top:4px}\n.foot{text-align:center;color:var(--mute);font:12px system-ui,sans-serif;margin-top:18px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <span class=\"tag\">18-mavzu · Davlat va huquq nazariyasi<\/span>\n  <h1>⚖️ Hokimiyatlar muvozanati<\/h1>\n  <p class=\"sub\">Qonun chiqaruvchi, ijro etuvchi va sud hokimiyati — ular bir-birini qanday tiyib turadi? 10 ta savol, 3 ustun. Har to‘g‘ri javob tegishli ustunni mustahkamlaydi.<\/p>\n\n  <div class=\"pillars\">\n    <div class=\"p\" data-b=\"q\"><div class=\"ic\">🏛️<\/div><b>Qonun chiqaruvchi<\/b><div class=\"bar\"><i><\/i><\/div><\/div>\n    <div class=\"p\" data-b=\"i\"><div class=\"ic\">🧑‍💼<\/div><b>Ijro etuvchi<\/b><div class=\"bar\"><i><\/i><\/div><\/div>\n    <div class=\"p\" data-b=\"s\"><div class=\"ic\">⚖️<\/div><b>Sud<\/b><div class=\"bar\"><i><\/i><\/div><\/div>\n  <\/div>\n\n  <div class=\"prog\" id=\"prog\"><\/div>\n  <div id=\"app\"><\/div>\n  <div class=\"foot\">Montesk‘ye g‘oyasi: “Hokimiyat hokimiyatni tiyib turishi kerak.”<\/div>\n<\/div>\n\n<script>\nvar Q=[\n{k:'Mexanizm',b:['i','q'],t:'Parlament qonunni qabul qildi, ammo Prezident uni imzolamay, e’tirozlari bilan parlamentga qaytardi. Bu qaysi tiyib turish mexanizmi?',o:['Impichment','Veto (to‘xtatuvchi e’tiroz)','Referendum','Sud prejudensiyasi'],a:1,e:'Veto — ijro hokimiyatining qonun chiqaruvchini tiyib turish vositasi. Parlament, odatda, malakali ko‘pchilik ovozi bilan vetoni yenga oladi — bu esa o‘zaro tiyib turishning “javob zarbasi”.'},\n{k:'Vaziyat',b:['s','i'],t:'Hukumat qarori Konstitutsiyaga zid ekani aniqlandi. Qaysi organ uni haqiqiy emas deb topishi mumkin?',o:['Parlament spikeri o‘z qaroriga ko‘ra','Vazirlar Mahkamasi o‘zi','Konstitutsiyaviy nazorat (sud) organi','Siyosiy partiyalar kengashi'],a:2,e:'Konstitutsiyaviy sud nazorati — sud hokimiyatining ijro va qonun chiqaruvchini Konstitutsiya doirasida ushlab turish vositasi.'},\n{k:'Fikrlash',b:['q','i','s'],t:'Tasavvur qiling: qonun chiqarish, ijro etish va hukm chiqarish — uchalasi bitta shaxs qo‘lida. Eng katta xavf nima?',o:['Ish tezlashadi, shuning uchun xavf yo‘q','Byurokratiya ko‘payadi','O‘zboshimchalik va avtoritarizm — nazorat qiluvchi hech kim qolmaydi','Soliqlar oshadi'],a:2,e:'Hokimiyat bir qo‘lda to‘planganda uni cheklaydigan kuch yo‘qoladi. Bo‘linish tamoyilining asl maqsadi — inson huquqlarini o‘zboshimchalikdan himoya qilish.'},\n{k:'Chalkash tushuncha',b:['q','i','s'],t:'Qaysi fikr hokimiyatlar bo‘linishi tamoyilini TO‘G‘RI ifodalaydi?',o:['Hokimiyatlar bir-biridan butunlay ajralgan va aloqasiz','Hokimiyatlar mustaqil, lekin hamkorlik qiladi va bir-birini tiyib turadi','Eng kuchlisi qolganlarini boshqaradi','Faqat sud boshqalarni nazorat qiladi'],a:1,e:'Bo‘linish ≠ izolyatsiya. Mustaqillik + hamkorlik + o‘zaro tiyib turish: bu “checks and balances” ning mohiyati.'},\n{k:'Mexanizm',b:['q','i'],t:'Parlament Hukumat hisobotini eshitadi va davlat byudjetini tasdiqlaydi. Bu nimaga misol?',o:['Sud nazoratiga','Qonun chiqaruvchining ijro hokimiyati ustidan parlament nazoratiga','Ijro hokimiyatining vetosiga','Prezidentning amnistiyasiga'],a:1,e:'“Hamyon” kimda bo‘lsa, ta’sir ham o‘sha yerda: byudjetni tasdiqlash va hisobot eshitish parlament nazoratining eng kuchli vositalaridan biri.'},\n{k:'Nega?',b:['s','i','q'],t:'Ko‘p mamlakatlarda sudyalarni tayinlashda ikki bosqich bor: bir organ nomzod ko‘rsatadi, boshqasi tasdiqlaydi. Buning asosiy sababi nima?',o:['Jarayonni sekinlashtirish uchun','Sudni bitta hokimiyat to‘liq qo‘lga olib qo‘ymasligi uchun','Sudyalar sonini kamaytirish uchun','Qonun shuni talab qilgani uchun, boshqa sababi yo‘q'],a:1,e:'Ikki kalitli tizim — sud mustaqilligini saqlash va ta’sirni taqsimlash usuli.'},\n{k:'Vaziyat',b:['s','i'],t:'Sud qaror chiqardi, lekin ijro organi uni bajarishdan bosh tortmoqda. Qaysi tamoyil buzilmoqda?',o:['Sud qarorlarining majburiyligi va sud mustaqilligi','Federalizm tamoyili','Plyuralizm tamoyili','Sud qarorni qayta ko‘rishi shart emas — hech narsa buzilmayapti'],a:0,e:'Sud qarori bajarilmasa, sud hokimiyati qog‘ozdagi hokimiyatga aylanadi. Qarorlarning majburiyligi — sud mustaqilligining ajralmas qismi.'},\n{k:'Mexanizm',b:['q','i'],t:'Impichment mexanizmi qaysi hokimiyatning qaysi hokimiyatni tiyib turishiga misol bo‘ladi?',o:['Sudning parlamentni','Ijroning sudni','Qonun chiqaruvchining ijro rahbarini (Prezidentni)','Sudning sudni'],a:2,e:'Impichment — parlament tomonidan yuqori mansabdor shaxsni og‘ir huquqbuzarlik uchun lavozimidan chetlatish tartibi (odatda sud organining ishtirokida).'},\n{k:'Metafora',b:['q','i','s'],t:'Hokimiyatlar bo‘linishini qaysi tasvir eng yaxshi ifodalaydi?',o:['Piramida: tepada bitta hukmdor','Orkestr, lekin dirijyorsiz','Uch oyoqli stul: biri zaiflashsa yoki haddan oshsa, stul ag‘dariladi','Estafeta: tayoqcha bir qo‘ldan ikkinchisiga o‘tadi va tamom'],a:2,e:'Muvozanat g‘oyasi: har bir “oyoq” teng yuk ko‘taradi va boshqasini ushlab turadi. Birining haddan oshishi butun tizimni ag‘daradi.'},\n{k:'Detektiv',b:['q','i','s'],t:'Qaysi holat hokimiyatlar bo‘linishi tamoyilini ENG JIDDIY buzadi?',o:['Parlament Hukumatdan hisobot talab qildi','Prezident hech qanday asossiz parlamentni tarqatib yubordi va sud bunga e’tibor bermadi','Sud qonunni Konstitutsiyaga zid deb topdi','Prezident qonunga veto qo‘ydi'],a:1,e:'Qolgan uch holat — qonuniy tiyib turish vositalari. Asossiz tarqatib yuborish + sud nazorati yo‘qligi esa tiyib turish tizimining ishdan chiqqanini ko‘rsatadi.'}\n];\nvar names={q:'Qonun chiqaruvchi',i:'Ijro etuvchi',s:'Sud'};\nvar max={q:0,i:0,s:0},val={q:0,i:0,s:0},cur=0,score=0,res=[];\nQ.forEach(function(x){x.b.forEach(function(b){max[b]++})});\nvar app=document.getElementById('app'),prog=document.getElementById('prog');\nfunction esc(s){return s}\nfunction drawProg(){prog.innerHTML='';Q.forEach(function(_,n){var s=document.createElement('span');\n s.className=n<res.length?(res[n]?'done':'wrong'):(n===cur?'cur':'');prog.appendChild(s)})}\nfunction drawBars(active){document.querySelectorAll('.p').forEach(function(p){var b=p.dataset.b;\n p.querySelector('i').style.width=(max[b]?val[b]/max[b]*100:0)+'%';\n p.classList.toggle('on',!!active&&active.indexOf(b)>-1)})}\nfunction show(){\n if(cur>=Q.length)return finish();\n var q=Q[cur];drawProg();drawBars(q.b);\n var h='<div class=\"card\"><div class=\"meta\"><span>Savol '+(cur+1)+' / '+Q.length+'<\/span><span class=\"kind\">'+q.k+'<\/span><\/div><p class=\"q\">'+q.t+'<\/p><div class=\"opts\">';\n q.o.forEach(function(t,n){h+='<button class=\"o\" data-n=\"'+n+'\"><span class=\"l\">'+'ABCD'[n]+'<\/span><span>'+t+'<\/span><\/button>'});\n h+='<\/div><div class=\"fb\" id=\"fb\"><\/div><button class=\"btn\" id=\"nx\">'+(cur===Q.length-1?'Natijani ko‘rish →':'Keyingi savol →')+'<\/button><\/div>';\n app.innerHTML=h;\n app.querySelectorAll('.o').forEach(function(b){b.onclick=function(){pick(+b.dataset.n)}});\n document.getElementById('nx').onclick=function(){cur++;show()};\n}\nfunction pick(n){\n var q=Q[cur],ok=n===q.a,btns=app.querySelectorAll('.o');\n btns.forEach(function(b,k){b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===n)b.classList.add('bad')});\n res.push(ok);if(ok){score++;q.b.forEach(function(b){val[b]++})}\n var fb=document.getElementById('fb');\n fb.innerHTML='<b>'+(ok?'✅ To‘g‘ri!':'❌ Aslida boshqacha')+'<\/b>'+q.e;\n fb.classList.add('show');document.getElementById('nx').classList.add('show');\n drawProg();drawBars(q.b);\n}\nfunction finish(){\n drawProg();drawBars(null);\n var r=score>=9?['🏆','Konstitutsiyaviy donishmand','Siz Montesk‘ye bilan bahslasha olasiz!']:\n score>=7?['⚖️','Muvozanat ustasi','Tiyib turish mexanizmlarini yaxshi tushunasiz.']:\n score>=5?['📘','Tajribali talaba','Asosiy g‘oyani tutdingiz — ayrim mexanizmlarni takrorlang.']:\n ['🌱','Boshlovchi','Mavzuni yana bir bor o‘qib, qayta urinib ko‘ring.'];\n var weak=Object.keys(max).sort(function(a,b){return val[a]/max[a]-val[b]/max[b]})[0];\n var h='<div class=\"card res\"><div style=\"font-size:48px\">'+r[0]+'<\/div><div class=\"score\">'+score+'/10<\/div><p class=\"rank\"><b>'+r[1]+'<\/b><\/p><p>'+r[2]+'<\/p><div class=\"sum\">';\n ['q','i','s'].forEach(function(b){h+='<div>'+names[b]+'<em>'+val[b]+'/'+max[b]+'<\/em><\/div>'});\n h+='<\/div>';\n if(score<10)h+='<p>Eng zaif ustun: <b>'+names[weak]+'<\/b> hokimiyati bilan bog‘liq savollarni takrorlang.<\/p>';\n h+='<button class=\"btn show\" id=\"rs\">Qayta o‘ynash ↺<\/button><\/div>';\n app.innerHTML=h;\n document.getElementById('rs').onclick=function(){cur=0;score=0;res=[];val={q:0,i:0,s:0};show()};\n}\nshow();\n<\/script>\n<\/body>\n<\/html>\n",B="<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Hokimiyat barabani — Savol o‘yini<\/title>\n<style>\n:root{--bg:#f4f1ea;--card:#fff;--ink:#16203a;--mute:#5d6682;--line:#e1dccf;--gold:#b8860b;--ok:#1f9d6b;--bad:#d64545;--sh:0 10px 30px rgba(22,32,58,.12);\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1226;--card:#161d38;--ink:#eef0f8;--mute:#9aa3c2;--line:#27305a;--gold:#e8b94a;--sh:0 10px 30px rgba(0,0,0,.45)}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh;\nbackground-image:radial-gradient(circle at 10% 0%,rgba(47,111,237,.15),transparent 40%),radial-gradient(circle at 95% 15%,rgba(217,130,43,.15),transparent 40%),radial-gradient(circle at 50% 100%,rgba(31,157,107,.14),transparent 45%)}\n.wrap{max-width:640px;margin:0 auto;padding:18px 16px 36px;text-align:center}\n.tag{font:700 11px system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}\nh1{font-size:clamp(24px,6vw,34px);margin:4px 0 12px}\n.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;font:600 13px system-ui,sans-serif}\n.hud div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--sh)}\n.hud b{font:700 18px Georgia,serif;color:var(--gold);display:block}\n.legend{display:flex;gap:12px;justify-content:center;font:12px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}\n.stage{position:relative;width:min(88vw,380px);aspect-ratio:1;margin:6px auto 14px}\n.stage canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px var(--gold),0 0 0 11px var(--card),var(--sh);transition:transform 4.6s cubic-bezier(.12,.7,.05,1)}\n.ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));z-index:2}\n.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--gold);display:grid;place-items:center;font-size:26px;z-index:1}\n.btn{padding:14px 28px;border:0;border-radius:16px;background:var(--gold);color:#16203a;font:800 16px system-ui,sans-serif;cursor:pointer;box-shadow:var(--sh);letter-spacing:.5px}\n.btn:disabled{opacity:.5;cursor:default}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.hint{color:var(--mute);font:14px system-ui,sans-serif;margin-top:10px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh);text-align:left;animation:in .4s}\n@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.top{display:flex;justify-content:space-between;align-items:center;font:700 12px system-ui,sans-serif;margin-bottom:8px}\n.pill{padding:4px 11px;border-radius:20px;color:#fff;letter-spacing:.8px}\n.pts{color:var(--gold);font-size:15px}\n.q{font-size:clamp(17px,3.8vw,21px);line-height:1.45;margin:6px 0 14px}\n.opts{display:grid;gap:9px}\n.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,sans-serif;cursor:pointer;transition:.15s}\n.o:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px)}\n.o .l{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px system-ui,sans-serif;background:var(--card);border:1px solid var(--line)}\n.o.ok{border-color:var(--ok);background:rgba(31,157,107,.15)}.o.bad{border-color:var(--bad);background:rgba(214,69,69,.13);animation:sh .35s}.o.gone{opacity:.18;pointer-events:none}\n@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.life{display:flex;gap:8px;margin-top:12px}\n.life button{flex:1;padding:9px;border-radius:12px;border:1.5px dashed var(--gold);background:transparent;color:var(--ink);font:600 13px system-ui,sans-serif;cursor:pointer}\n.life button:disabled{opacity:.35;cursor:default}\n.fb{display:none;margin-top:14px;padding:13px;border-radius:13px;background:var(--bg);border-left:4px solid var(--gold);font:14.5px/1.5 system-ui,sans-serif}\n.fb.show{display:block;animation:in .3s}\n.big{font-size:60px;font-weight:700;color:var(--gold);margin:4px 0}\n.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:800 40px system-ui,sans-serif;pointer-events:none;animation:up 1.2s forwards;z-index:9;text-shadow:0 2px 12px rgba(0,0,0,.3)}\n@keyframes up{to{opacity:0;transform:translate(-50%,-130%)}}\n.hid{display:none}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <span class=\"tag\">18-mavzu · Hokimiyatlar bo‘linishi<\/span>\n  <h1>🎡 Hokimiyat barabani<\/h1>\n  <div class=\"hud\">\n    <div>Ball<b id=\"sc\">0<\/b><\/div><div>Qolgan sektor<b id=\"left\">10<\/b><\/div><div>Ketma-ket<b id=\"st\">0<\/b><\/div>\n  <\/div>\n  <div id=\"wheelView\">\n    <div class=\"legend\"><span><i style=\"background:#2f6fed\"><\/i>Qonun chiqaruvchi<\/span><span><i style=\"background:#d9822b\"><\/i>Ijro<\/span><span><i style=\"background:#1f9d6b\"><\/i>Sud<\/span><\/div>\n    <div class=\"stage\"><div class=\"ptr\"><\/div><canvas id=\"cv\" width=\"760\" height=\"760\"><\/canvas><div class=\"hub\">⚖️<\/div><\/div>\n    <button class=\"btn\" id=\"spin\">BARABANNI AYLANTIR!<\/button>\n    <p class=\"hint\" id=\"hint\">Baraban qaysi sektorda to‘xtasa, o‘sha savolga javob berasiz. To‘g‘ri javob — ball, xato — ballning yarmi ketadi.<\/p>\n  <\/div>\n  <div id=\"quizView\" class=\"hid\"><\/div>\n<\/div>\n\n<script>\nvar S=[\n{b:'i',p:100,t:'Prezident qonunga veto qo‘ydi, lekin parlament uni qabul qiluvchilarning 2/3 ovozi bilan yengib o‘tdi. Bu nimani ko‘rsatadi?',o:['Hokimiyatlar o‘rtasida o‘zaro tiyib turish ikki tomonlama ekanini','Prezident hokimiyati cheksizligini','Sudning parlamentdan ustunligini','Hokimiyatlar bo‘linishi bekor qilinganini'],a:0,e:'Veto — ijroning vositasi, uni yengish — parlamentning javobi. Tiyib turish bir tomonlama emas, ikki tomonlama ishlaydi.'},\n{b:'q',p:200,t:'“Qonunlar ruhi haqida” asarida hokimiyatlar bo‘linishi nazariyasini mukammal bayon etgan mutafakkir kim?',o:['Tomas Gobbs','Jan-Jak Russo','Sharl Lui Montesk‘ye','Nikkolo Makiavelli'],a:2,e:'Montesk‘ye (1748) Lokk g‘oyalarini rivojlantirib, uch hokimiyatni bir-biridan ajratishni erkinlik kafolati deb hisobladi.'},\n{b:'q',p:300,t:'Parlament Hukumatga ishonchsizlik bildirdi. Bu holatda nima yuz beradi?',o:['Parlament tarqatib yuboriladi, sud aralashadi','Hukumat javobgarlikka tortiladi yoki iste’foga chiqadi — qonun chiqaruvchi ijroni tiyib turadi','Hech narsa, bu faqat ramziy','Sud darhol yangi hukumat tuzadi'],a:1,e:'Ishonchsizlik votumi — parlament nazoratining eng og‘ir vositalaridan biri (parlament shaklidagi boshqaruvda ayniqsa).'},\n{b:'s',p:300,t:'Sudya ishni ko‘rayotganda “yuqoridan” qo‘ng‘iroq bo‘lib, “hukm shunday bo‘lsin” deyildi. Qaysi tamoyil buzildi?',o:['Sud mustaqilligi va faqat qonunga bo‘ysunish','Parlament suvereniteti','Federalizm','Ommaviy oshkoralik'],a:0,e:'Sudya faqat qonun va vijdoniga bo‘ysunadi. Har qanday aralashuv — sud hokimiyatining mustaqilligiga tahdid.'},\n{b:'i',p:400,t:'Ijro hokimiyati farmon va qarorlar chiqara oladimi? Bu bo‘linish tamoyiliga zid emasmi?',o:['Zid, faqat parlament hujjat chiqaradi','Zid emas, lekin ular qonunga asoslanishi va unga zid bo‘lmasligi shart','Zid emas, ular qonundan ustun turadi','Faqat sud ruxsati bilan'],a:1,e:'Qonun osti hujjatlar qonunni ijro etish uchun chiqariladi. Ular qonunga zid bo‘lsa, sud yoki konstitutsiyaviy nazorat orqali bekor qilinishi mumkin.'},\n{b:'s',p:200,t:'“Kim qo‘riqchining o‘zini qo‘riqlaydi?” Sud hokimiyati ham nazoratsiz qolmasligi uchun qaysi vosita xizmat qiladi?',o:['Sudyalar hech kimga javobgar emas','Apellyatsiya-kassatsiya instansiyalari, qonunga bog‘liqlik va intizomiy javobgarlik','Faqat Prezident farmoni','Ommaviy ovoz berish'],a:1,e:'Yuqori instansiya sudlar quyi sudlarni tekshiradi, sudyalar esa qonun va odob qoidalari bilan chegaralangan.'},\n{b:'i',p:500,t:'Prezident sud hukmi bilan mahkum etilgan shaxsni afv etdi. Bu qaysi mexanizmga yaqin?',o:['Sudning ijroni tiyishiga','Ijro hokimiyatining sud natijalariga ta’siriga (afv institutiga)','Parlamentning veto huquqiga','Konstitutsiyaviy referendumga'],a:1,e:'Afv — ijro rahbarining sud hukmi oqibatlarini yumshatish vakolati; shu bilan u sud hukmini ma’lum darajada muvozanatlaydi.'},\n{b:'q',p:400,t:'Parlament sud hokimiyatiga qanday qonuniy ta’sir ko‘rsatishi mumkin?',o:['Sudyalarga to‘g‘ridan-to‘g‘ri hukm aytib turish orqali','Sud tizimi va tartibini qonun bilan belgilash hamda sudyalarni tayinlashda ishtirok etish orqali','Sudni tarqatib yuborish orqali','Hech qanday usul bilan'],a:1,e:'Parlament sud tizimini qonun bilan tashkil etadi va ko‘p mamlakatlarda sudya nomzodlarini tasdiqlaydi, lekin ishlar bo‘yicha qarorga aralashmaydi.'},\n{b:'s',p:100,t:'“Qonun oldida hamma teng” — bu tamoyilni amalda eng ko‘p qaysi hokimiyat ta’minlaydi?',o:['Qonun chiqaruvchi','Ijro etuvchi','Sud hokimiyati','Matbuot'],a:2,e:'Sud — bahslarni hal qiluvchi va huquq buzilsa tiklovchi organ. Aynan shu bois uning mustaqilligi eng muhim kafolatdir.'},\n{b:'s',p:500,t:'Futbol misoli: qoidalarni yozuvchi — parlament, maydonda o‘ynovchi — ijro. Unda “hakam” kim?',o:['Prezident','Sud hokimiyati — qoida buzilganini xolis hal qiladi','Parlament spikeri','Tomoshabinlar'],a:1,e:'Agar hakam bir jamoaga yon bossa, o‘yin adolatsiz bo‘ladi. Xuddi shu kabi, sud mustaqil bo‘lmasa, hokimiyatlar muvozanati buziladi.'}\n];\nvar COL={q:'#2f6fed',i:'#d9822b',s:'#1f9d6b'},NM={q:'QONUN CHIQARUVCHI',i:'IJRO',s:'SUD'};\nvar N=S.length,SEG=360/N,rot=0,score=0,streak=0,done=[],cur=-1,busy=false,l50=true,lhint=true,cv=document.getElementById('cv'),ctx=cv.getContext('2d');\nfunction $(id){return document.getElementById(id)}\nfunction draw(){\n var W=cv.width,c=W/2,R=c-6;ctx.clearRect(0,0,W,W);\n for(var k=0;k<N;k++){\n  var a0=(-90+k*SEG)*Math.PI/180,a1=(-90+(k+1)*SEG)*Math.PI/180;\n  ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,a0,a1);ctx.closePath();\n  ctx.fillStyle=done[k]?'#7a8095':COL[S[k].b];ctx.fill();\n  ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();\n  ctx.save();ctx.translate(c,c);ctx.rotate((a0+a1)/2);ctx.textAlign='right';ctx.fillStyle='#fff';\n  ctx.font='bold 54px Georgia,serif';ctx.fillText(done[k]?'✓':(k+1),R-30,-2);\n  ctx.font='bold 30px system-ui,sans-serif';ctx.fillText(done[k]?'':S[k].p,R-30,36);ctx.restore();\n }\n}\nfunction hud(){$('sc').textContent=score;$('st').textContent=streak;$('left').textContent=left()}\nfunction left(){var n=0;for(var k=0;k<N;k++)if(!done[k])n++;return n}\nfunction spin(){\n if(busy)return;var av=[];for(var k=0;k<N;k++)if(!done[k])av.push(k);\n if(!av.length)return;busy=true;$('spin').disabled=true;\n cur=av[Math.floor(Math.random()*av.length)];\n var jit=(Math.random()-.5)*SEG*.7,target=((360-(cur+.5)*SEG+jit)%360+360)%360,\n delta=360*6+(((target-rot%360)%360)+360)%360;\n rot+=delta;cv.style.transform='rotate('+rot+'deg)';\n setTimeout(ask,4800);\n}\nfunction ask(){\n var q=S[cur];l50used=false;\n $('wheelView').classList.add('hid');var v=$('quizView');v.classList.remove('hid');\n var h='<div class=\"card\"><div class=\"top\"><span class=\"pill\" style=\"background:'+COL[q.b]+'\">'+NM[q.b]+' · SEKTOR '+(cur+1)+'<\/span><span class=\"pts\">'+q.p+' ball<\/span><\/div><p class=\"q\">'+q.t+'<\/p><div class=\"opts\">';\n q.o.forEach(function(t,n){h+='<button class=\"o\" data-n=\"'+n+'\"><span class=\"l\">'+'ABCD'[n]+'<\/span><span>'+t+'<\/span><\/button>'});\n h+='<\/div><div class=\"life\"><button id=\"b50\"'+(l50?'':' disabled')+'>✂️ 50/50<\/button><button id=\"bh\"'+(lhint?'':' disabled')+'>💡 Ishora<\/button><\/div><div class=\"fb\" id=\"fb\"><\/div><div style=\"text-align:center\"><button class=\"btn dark hid\" id=\"nx\" style=\"margin-top:14px\">Barabanga qaytish →<\/button><\/div><\/div>';\n v.innerHTML=h;\n v.querySelectorAll('.o').forEach(function(b){b.onclick=function(){pick(+b.dataset.n)}});\n $('b50').onclick=function(){l50=false;this.disabled=true;var w=[];q.o.forEach(function(_,n){if(n!==q.a)w.push(n)});w.sort(function(){return Math.random()-.5});\n  v.querySelectorAll('.o').forEach(function(b){var n=+b.dataset.n;if(n===w[0]||n===w[1])b.classList.add('gone')})};\n $('bh').onclick=function(){lhint=false;this.disabled=true;var f=$('fb');f.innerHTML='💡 <b>Ishora:<\/b> '+HINTS[cur];f.classList.add('show')};\n}\nvar HINTS=['Zarba va javob zarbasi: yo‘l ikki tomonga ochiq.','Bordo yaqinidagi baron, XVIII asr fransuz ma’rifatparvari.','Ishonch yo‘qolsa, kursi ham ketadi.','Sudya faqat qonunga quloq soladi, telefon qo‘ng‘iroqlariga emas.','Ijrochi qonun yo‘lidan chiqib keta olmaydi.','Yuqori instansiya quyisini tekshiradi: sudyaning ham javobgarligi bor.','Hukmni sud chiqaradi, yengillikni esa ijro rahbari beradi.','Parlament sud tizimining “qurilishini” belgilaydi, ish ichiga aralashmaydi.','Nizoni hal qiladigan, adolat tarozisining sohibi.','Hakam o‘yin tashqarisida va xolis turadi.'];\nfunction pick(n){\n var q=S[cur],ok=n===q.a,v=$('quizView');\n v.querySelectorAll('.o').forEach(function(b,k){b.disabled=true;b.style.pointerEvents='none';if(k===q.a)b.classList.add('ok');else if(k===n)b.classList.add('bad')});\n var d;if(ok){streak++;d=q.p+(streak>=3?100:0);score+=d}else{streak=0;d=-Math.floor(q.p/2);score=Math.max(0,score+d)}\n done[cur]=true;\n var f=$('fb');f.innerHTML='<b>'+(ok?'✅ To‘g‘ri! +'+d+' ball'+(streak>=3?' (seriya bonusi 🔥)':''):'❌ Xato. '+d+' ball')+'<\/b><br>'+q.e;f.classList.add('show');\n pop((d>0?'+':'')+d,ok);hud();var nx=$('nx');nx.classList.remove('hid');nx.textContent=left()?'Barabanga qaytish →':'Natijani ko‘rish →';nx.onclick=back;\n}\nfunction pop(t,ok){var e=document.createElement('div');e.className='pop';e.textContent=t;e.style.color=ok?'#1f9d6b':'#d64545';document.body.appendChild(e);setTimeout(function(){e.remove()},1300)}\nfunction back(){\n $('quizView').classList.add('hid');\n if(!left())return fin();\n $('wheelView').classList.remove('hid');draw();busy=false;$('spin').disabled=false;\n}\nfunction fin(){\n var max=0;S.forEach(function(x){max+=x.p});\n var r=score>=max*.8?['🏆','Konstitutsiyaviy donishmand']:score>=max*.5?['⚖️','Muvozanat ustasi']:score>=max*.25?['📘','Tajribali talaba']:['🌱','Boshlovchi'];\n var v=$('quizView');v.classList.remove('hid');\n v.innerHTML='<div class=\"card\" style=\"text-align:center\"><div style=\"font-size:52px\">'+r[0]+'<\/div><div class=\"big\">'+score+'<\/div><p style=\"font:15px system-ui,sans-serif;color:var(--mute)\">'+max+' balldan (qo‘lga kiritilgan)<\/p><h2 style=\"margin:6px 0 14px\">'+r[1]+'<\/h2><button class=\"btn\" id=\"rs\">Qayta o‘ynash ↺<\/button><\/div>';\n $('rs').onclick=function(){done=[];score=0;streak=0;l50=true;lhint=true;v.classList.add('hid');$('wheelView').classList.remove('hid');draw();hud();busy=false;$('spin').disabled=false};\n}\n$('spin').onclick=spin;draw();hud();\n<\/script>\n<\/body>\n<\/html>\n";
var f1=document.getElementById('f1'),f2=document.getElementById('f2'),t1=document.getElementById('t1'),t2=document.getElementById('t2');
f1.srcdoc=A;f2.srcdoc=B;
function go(n){var one=n===1;f1.classList.toggle('on',one);f2.classList.toggle('on',!one);t1.classList.toggle('on',one);t2.classList.toggle('on',!one);try{location.hash=one?'test':'baraban'}catch(e){}}
t1.onclick=function(){go(1)};t2.onclick=function(){go(2)};
